media:
  - name: images
    label: Зображення
    input: public/media/images
    output: /media/images
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: documents
    label: PDF-документи
    input: public/files
    output: /files
    extensions: [pdf]
    categories: [document]
    rename: safe

components:
  status:
    type: select
    label: Статус
    required: true
    default: draft
    description: Лише статус «Опубліковано» робить матеріал видимим на сайті. Репозиторій публічний, тому чернетки не повинні містити непублічних даних.
    options:
      values:
        - name: draft
          label: Чернетка
        - name: review
          label: На перевірці
        - name: published
          label: Опубліковано
  slug:
    type: string
    label: Slug адреси
    required: true
    description: Латинські малі літери, цифри й дефіси. Не змінюйте після публікації.
    pattern:
      regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      message: Використовуйте лише a-z, 0-9 і дефіси.
  photo:
    type: object
    label: Фотографія
    fields:
      - name: src
        label: Файл
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Альтернативний опис
        type: string
        required: true
        description: Опишіть зміст зображення для людей, які його не бачать.
      - name: caption
        label: Підпис
        type: string

content:
  - name: news
    label: Новини
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, publishedAt, category, status]
      search: [title, summary, category]
      sort: [publishedAt, title, status]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: slug
        component: slug
      - name: publishedAt
        label: Дата публікації
        type: date
        required: true
        description: Матеріал із майбутньою датою не з’явиться на сайті до настання цієї дати.
        options:
          format: yyyy-MM-dd
      - name: category
        label: Категорія
        type: select
        required: true
        options:
          values: [Події, Навчання, Спільнота, Досягнення]
      - name: summary
        label: Короткий опис
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 360
      - name: cover
        label: Головне зображення
        component: photo
      - name: gallery
        label: Фотогалерея
        type: object
        list:
          max: 30
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Файл
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Альтернативний опис
            type: string
            required: true
          - name: caption
            label: Підпис
            type: string
      - name: status
        component: status
      - name: featured
        label: Показувати серед останніх
        type: boolean
        default: false
        description: Позначені матеріали отримують пріоритет у блоці новин на головній сторінці.
      - name: seoTitle
        label: SEO-заголовок
        type: string
      - name: seoDescription
        label: SEO-опис
        type: text
      - name: sourceUrl
        label: Першоджерело
        type: string
        description: HTTPS-посилання на офіційну публікацію, з якої підготовлено матеріал.
      - name: body
        label: Текст новини
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          switcher: false

  - name: documents
    label: Документи
    type: collection
    path: src/content/documents
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, documentDate, category, status]
      search: [title, summary, category, academicYear]
      sort: [documentDate, title, status]
      default:
        sort: documentDate
        order: desc
    fields:
      - name: title
        label: Назва документа
        type: string
        required: true
      - name: slug
        component: slug
      - name: category
        label: Категорія
        type: select
        required: true
        options:
          values: [Установчі документи, Освітній процес, Для батьків, Звіти, Безпека та правила]
      - name: documentDate
        label: Дата документа
        type: date
        description: Обов’язково підтвердьте дату перед публікацією. Не використовуйте дату завантаження.
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Короткий опис
        type: text
        required: true
      - name: pdf
        label: PDF-файл
        type: file
        description: Для невеликих файлів. Якщо документ завеликий для CMS, використайте офіційне зовнішнє посилання нижче.
        options:
          media: documents
          extensions: [pdf]
      - name: externalUrl
        label: Офіційне зовнішнє посилання
        type: string
        description: Для великих файлів на офіційному Google Drive. Для публікації потрібен PDF або це посилання.
      - name: status
        component: status
      - name: academicYear
        label: Навчальний рік
        type: string
        description: "Наприклад: 2026–2027"
      - name: sourceUrl
        label: Сторінка-першоджерело
        type: string
        description: Сторінка старого офіційного сайту, де оприлюднено документ.
      - name: body
        label: Примітки
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: false

  - name: announcements
    label: Оголошення
    type: collection
    path: src/content/announcements
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, publishedAt, expiresAt, important, status]
      search: [title]
      sort: [publishedAt, expiresAt, title, status]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Назва
        type: string
        required: true
      - name: slug
        component: slug
      - name: publishedAt
        label: Дата публікації
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: expiresAt
        label: Актуальне до
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: status
        component: status
      - name: important
        label: Важливе оголошення
        type: boolean
        default: false
      - name: sourceUrl
        label: Першоджерело
        type: string
        description: HTTPS-посилання на офіційне оголошення.
      - name: body
        label: Текст оголошення
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
          switcher: false

  - name: galleries
    label: Фотогалереї
    type: collection
    path: src/content/galleries
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, date, status]
      search: [title, description]
      sort: [date, title, status]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Назва
        type: string
        required: true
      - name: slug
        component: slug
      - name: date
        label: Дата
        type: date
        description: Обов’язково підтвердьте дату перед публікацією.
        options:
          format: yyyy-MM-dd
      - name: description
        label: Опис
        type: text
        required: true
      - name: cover
        label: Обкладинка
        component: photo
      - name: photos
        label: Фотографії
        type: object
        required: true
        list:
          min: 1
          max: 60
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Файл
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Альтернативний опис
            type: string
            required: true
          - name: caption
            label: Підпис
            type: string
      - name: status
        component: status
      - name: sourceUrl
        label: Першоджерело
        type: string
        description: HTTPS-посилання на офіційну публікацію або фотозвіт.
      - name: body
        label: Додатковий текст
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: false

  - name: schedules
    label: Розклад уроків
    type: collection
    path: src/content/schedules
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: className
      fields: [className, academicYear, updatedAt, status]
      search: [className, academicYear]
      sort: [className, updatedAt, status]
      default:
        sort: className
        order: asc
    fields:
      - name: title
        label: Назва запису
        type: string
        required: true
        description: "Наприклад: Розклад 7-А класу"
      - name: slug
        component: slug
        description: Унікальний ідентифікатор класу для адреси, наприклад 7-a. Не змінюйте після публікації.
      - name: className
        label: Назва класу
        type: string
        required: true
        description: "Так, як її побачать відвідувачі: 7-А клас"
      - name: academicYear
        label: Навчальний рік
        type: string
        required: true
        description: "Формат: 2026–2027"
        pattern:
          regex: "^\\d{4}–\\d{4}$"
          message: Використовуйте формат 2026–2027 із довгим тире.
      - name: updatedAt
        label: Оновлено
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        component: status
      - name: sourceUrl
        label: Офіційне першоджерело
        type: string
        description: Для публікації потрібне HTTPS-посилання на затверджений розклад. Чернетка може бути без нього.
      - name: notes
        label: Загальна примітка
        type: text
      - name: days
        label: Дні тижня
        type: object
        required: true
        list:
          max: 5
          collapsible:
            collapsed: true
            summary: "{day}"
        fields:
          - name: day
            label: День
            type: select
            required: true
            options:
              values:
                - name: monday
                  label: Понеділок
                - name: tuesday
                  label: Вівторок
                - name: wednesday
                  label: Середа
                - name: thursday
                  label: Четвер
                - name: friday
                  label: П’ятниця
          - name: lessons
            label: Уроки
            type: object
            required: true
            list:
              max: 13
              collapsible:
                collapsed: true
                summary: "{number}. {subject}"
            fields:
              - name: number
                label: Номер уроку
                type: number
                required: true
              - name: subject
                label: Предмет
                type: string
                required: true
              - name: start
                label: Початок
                type: string
                description: "Необов’язково. Формат: 09:00"
              - name: end
                label: Завершення
                type: string
                description: "Необов’язково. Формат: 09:45"
              - name: room
                label: Кабінет
                type: string
              - name: teacher
                label: Учитель
                type: string
                description: Додавайте лише дані, дозволені до публікації.
              - name: note
                label: Примітка
                type: string
              - name: groups
                label: Поділ на групи
                type: object
                list:
                  max: 6
                  collapsible:
                    collapsed: true
                    summary: "{name}"
                fields:
                  - name: name
                    label: Назва групи
                    type: string
                    required: true
                  - name: subject
                    label: Предмет
                    type: string
                  - name: room
                    label: Кабінет
                    type: string
                  - name: teacher
                    label: Учитель
                    type: string
                  - name: note
                    label: Примітка
                    type: string

  - name: bellSchedules
    label: Розклад дзвінків
    type: collection
    path: src/content/bell-schedules
    format: yaml-frontmatter
    filename:
      template: "{fields.slug}.md"
      field: false
    view:
      primary: title
      fields: [title, academicYear, updatedAt, status]
      search: [title, academicYear]
      sort: [title, updatedAt, status]
    fields:
      - name: title
        label: Група класів
        type: string
        required: true
      - name: slug
        component: slug
      - name: note
        label: Примітка
        type: text
      - name: academicYear
        label: Навчальний рік
        type: string
        required: true
        description: "Формат: 2026–2027"
      - name: updatedAt
        label: Дата затвердження або оновлення
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: status
        component: status
      - name: sourceUrl
        label: Офіційна сторінка-першоджерело
        type: string
      - name: documentUrl
        label: Затверджений документ
        type: string
      - name: lessons
        label: Дзвінки
        type: object
        required: true
        list:
          min: 1
          max: 13
          collapsible:
            collapsed: true
            summary: "Урок {number}: {start}–{end}"
        fields:
          - name: number
            label: Номер уроку
            type: number
            required: true
          - name: start
            label: Початок
            type: string
            required: true
            description: "Формат: 09:00"
          - name: end
            label: Завершення
            type: string
            required: true
            description: "Формат: 09:45"
          - name: breakAfterMinutes
            label: Перерва після уроку, хв
            type: number

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: створено {path} через Pages CMS"
      update: "content: оновлено {path} через Pages CMS"
      delete: "content: видалено {path} через Pages CMS"
      rename: "content: перейменовано {oldPath} на {newPath} через Pages CMS"
